name: "Linting"
description: "Run linting on the code base "
inputs:
  python-version:
    description: 'The version of python'
    required: true
runs:
  using: "composite"
  steps:
  - name: Set up Python ${{ inputs.python-version }}
    uses: actions/setup-python@v5
    with:
      python-version: "${{ inputs.python-version }}"

  - name: "Install Poetry"
    shell: bash
    env:
      POETRY_VERSION: 2.4.1
    run: |
      curl -sSL https://install.python-poetry.org | python3 -
      echo "$HOME/.local/bin" >> $GITHUB_PATH
      poetry env use ${{ inputs.python-version }}
      poetry install
  - name: Run pre-commit
    uses: pre-commit/action@v3.0.1
    env:
      # no-commit-to-branch guards against committing to master locally.
      # CI checks out master by design, so the hook always fails there and
      # masks genuine lint failures behind a red run.
      SKIP: no-commit-to-branch
