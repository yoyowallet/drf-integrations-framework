name: "DRF integrations framework Tests"

inputs:
  python-version:
    description: 'The version of python'
    required: true

runs:
  using: "composite"
  steps:
  - name: Set up Python ${{ inputs.python-version }}
    uses: actions/setup-python@v5
    with:
      python-version: ${{ inputs.python-version }}

  - name: Install Poetry
    uses: snok/install-poetry@v1
    with:
      # Pin the CI toolchain so a future Poetry release cannot change its Python
      # requirement and unexpectedly break otherwise supported matrix jobs.
      version: 2.4.1
      virtualenvs-create: true
      virtualenvs-in-project: true

  - name: Load cached venv
    id: cached-poetry-dependencies
    uses: actions/cache@v3
    with:
      path: .venv
      key: venv-${{ runner.os }}-${{ inputs.python-version }}-poetry-2.4.1-${{ hashFiles('**/poetry.lock') }}

  - name: Install dependencies
    if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
    shell: bash
    run: poetry install --with dev

  - name: Install tox
    shell: bash
    run: |
      poetry run pip install tox tox-gh-actions

  - name: Test with tox
    shell: bash
    run: poetry run tox
