# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.

[tool.poetry]
name = "drf-integrations-framework"
version = "0.9.0-alpha"
description = "Django REST Framework plugin that simplifies the management of third party integrations"
authors = ["Yoyo <dev@yoyowallet.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yoyowallet/drf-integrations-framework"
repository = "https://github.com/yoyowallet/drf-integrations-framework"
keywords = ["drf"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries',
    'Framework :: Django',
]
include = [
    "LICENSE",
]
packages = [
    { include="drf_integrations" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
djangorestframework = ">=3.11.0,<4"

[tool.poetry.group.dev.dependencies]
# Going above django-oauth-toolkit 1.5 causes issues with OAUTH2_PROVIDER_ACCESS_TOKEN_MODEL
# And swappable dependencies
django-oauth-toolkit = ">=1.3,<1.5"
django-environ = ">=0.9.0"
psycopg2-binary = "^2.9.10"
setuptools = "<81"

black = "*"
factory-boy = "*"
flake8 = "*"
isort = "*"
mixpanel = "^4.9.0"
pre-commit = "*"
pytest = "*"
pytest-django = "*"
pytest-mock = "*"
tox = "*"
twine = "^5.1.1"
pytest-coverage = "^0.0"
bumpversion = "^0.6.0"
pillow = "^11.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py312"]
line-length = 88
include = '\.pyi?$'
skip-string-normalization = true
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
known_standard_library = "dataclasses,typing"
known_first_party = "drf_integrations,example,tests"
default_section = "THIRDPARTY"
skip_glob = "venv/*"
ensure_newline_before_comments = true


[tool.flake8]
# Extend-ignore settings, ignoring specific errors and warnings
extend-ignore = ["E203", "E501", "W503", "B904", "B905", "B907"]

# Select specific error and warning categories to check
select = ["B", "C", "E", "F", "W", "T4", "B9"]

# Maximum allowed line length (88 characters) with a note on using B950
max-line-length = 88

# Maximum allowed cyclomatic complexity for functions/methods
max-complexity = 18
